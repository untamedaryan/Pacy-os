general {
    lock_cmd = pidof hyprlock || hyprlock     # don't start multiple instances
    before_sleep_cmd = loginctl lock-session   # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on # turn screen back on after wake
}

# Lock screen after 2 minutes idle
listener {
    timeout = 120
    on-timeout = hyprlock
    on-resume = notify-send "󰊠 Welcome back!" "Welcome to your Workstation"   # optional
}

# Optional: Turn off screen after 5 minutes (recommended)
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
