# === Portal & Session Fixes (Important for Live ISO) ===
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user start graphical-session.target

# My original stuff starts here
exec-once = hyprpaper
exec-once = waybar

general {
    gaps_in = 3
    gaps_out = 2,10,10,10
    border_size = 2
}

bind = SUPER, RETURN, exec, kitty
bind = SUPER, F, exec, kitty --class yazi -e yazi
bind = SUPER, W, exec, kitty --class=Gazelle -e gazelle
bind = SUPER, B, exec, firefox
bind = SUPER, Escape, exit
bind = SUPER, Q, killactive
bind = SUPER, KP_ADD, fullscreen, 1
bind = SUPER, Prior, fullscreen

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

bind = SUPER SHIFT, left, swapwindow, l
bind = SUPER SHIFT, right, swapwindow, r
bind = SUPER SHIFT, up, swapwindow, u
bind = SUPER SHIFT, down, swapwindow, d

bind = SUPER, KP_End, workspace, 1
bind = SUPER, KP_Down, workspace, 2
bind = SUPER, KP_Next, workspace, 3
bind = SUPER, KP_Left, workspace, 4

bind = SUPER SHIFT, KP_End, movetoworkspace, 1
bind = SUPER SHIFT, KP_Down, movetoworkspace, 2
bind = SUPER SHIFT, KP_Next, movetoworkspace, 3
bind = SUPER SHIFT, KP_Left, movetoworkspace, 4

bind = SUPER, Space, exec, rofi -show drun
bind = SUPER, C, exec, rofi -show calc

device {
    name = elan06fa:00-04f3:327e-touchpad
    natural_scroll = true
    tap-to-click = true
    disable_while_typing = true
}

decoration {
    rounding = 7
    blur {
        enabled = true
        size = 5
        passes = 4
        new_optimizations = true
    }
}

animations {
    enabled = yes
    animation = windows, 1, 5, default
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 6, default
}
