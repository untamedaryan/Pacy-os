# Portal & Session fixes
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user start graphical-session.target   # even if it refuses, it's fine
exec-once = hyprpaper
exec-once = waybar
exec-once = swaync
exec-once = hypridle
exec-once = sleep 2 && notify-send "󰊠 Pacy OS" "Welcome to Pacy OS, Aryan!" -u normal -t 5000



# https://wiki.hypr.land/Configuring/Variables/#misc                                                                                                                                    
misc {                                                                                                                                                                                
    force_default_wallpaper = 0   # Set to 0 or 1 to disable the anime mascot wallpapers                                                                                                
    disable_hyprland_logo = true  # If true disables the random hyprland logo / anime girl background. :(                                                                               
} 


general {
    gaps_in = 2
    gaps_out = 1,5,5,5        
    border_size = 1
    col.active_border = rgba(606060ff)
    col.inactive_border = rgba(1a1a1aff)
}
    #border_size = 2


bind = SUPER, Escape, exit
bind = SUPER, backspace, exec, hyprlock
bind = SUPER, RETURN, exec, kitty
bind = SUPER, F, exec, kitty --class yazi -e yazi#this helps open the yazi a tui based file manager
bind = SUPER, W, exec, kitty --class=Gazelle -e gazelle
bind = SUPER, B, exec, firefox #this will open the firefox
bind = SUPER, Q, killactive
bind = SUPER, KP_ADD, fullscreen, 1
bind = SUPER, Prior, fullscreen

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

bind = SUPER SHIFT, left, swapwindow, l
bind = SUPER SHIFT, right, swapwindow, r
bind = SUPER SHIFT, up, swapwindow, u
bind = SUPER SHIFT, down, swapwindow, d

# Navigate to workspace with Ctrl + Numpad 1-4
bind = SUPER, H, workspace, 1  #KP_End,       workspace, 1  # Numpad 1
bind = SUPER, J, workspace, 2   #KP_Down,      workspace, 2  # Numpad 2
bind = SUPER, K,  workspace, 3   #KP_Next,      workspace, 3  # Numpad 3
bind = SUPER, L,  workspace, 4   #KP_Left,      workspace, 4  # Numpad 4

# Move window to workspace with Ctrl + Shift + Numpad 1-4
bind = SUPER SHIFT, H, movetoworkspace, 1  #KP_End,  movetoworkspace, 1
bind = SUPER SHIFT, J, movetoworkspace, 2 #KP_Down, movetoworkspace, 2
bind = SUPER SHIFT, K, movetoworkspace, 3#KP_Next, movetoworkspace, 3
bind = SUPER SHIFT, L, movetoworkspace, 4#KP_Left, movetoworkspace, 4

bind = SUPER, Space, exec, rofi -show drun        # App launcher
bind = SUPER, C,     exec, rofi -show calc        # Calculator


device {
    name = elan06fa:00-04f3:327e-touchpad
    natural_scroll = true
    tap-to-click = true
    disable_while_typing = true
}


general {
    border_size = 1
    col.active_border = rgba(606060ff)
    col.inactive_border = rgba(1a1a1aff)
}



decoration {
    rounding = 7
    blur {
        enabled = true
        size = 6
        passes = 4
        new_optimizations = true
    }
   
}

animations {
    enabled = yes

    animation = windows, 1, 5, default
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 6, default
}


